<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MafiaCity — дуэль</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;font-size:15px;line-height:1.4}
h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase}
h2{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sub{color:var(--muted);font-size:12px;margin:2px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:10px 8px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.opt small{display:block;color:var(--muted);font-size:12px;font-family:var(--mono)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg);width:100%}
.btn.secondary{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.field{display:block;margin-bottom:10px}
/* arena */
.fighters{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.fighter{min-width:0}
.fighter .name{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.fighter.me .name{color:var(--accent)} .fighter.bot .name{color:var(--enemy)}
.fighter .w{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hp{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.hp i{display:block;height:100%;background:var(--good);transition:width .3s}
.hpn{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.dist{text-align:center;font-family:var(--display);font-size:24px;line-height:1;padding-top:4px;font-variant-numeric:tabular-nums}
.dist small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.smoke{border-color:var(--smoke);color:var(--smoke)}
.tag.ok{border-color:var(--good);color:var(--good)} .tag.no{border-color:var(--warn);color:var(--warn)}
.scene-heading{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:12px}
.view3d{margin-top:6px;border-radius:8px;overflow:hidden;background:var(--line)}
.view3d canvas{display:block}
/* scheme */
.scheme{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.scheme svg{width:100%;height:auto;display:block}
.scheme .lbl{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.scheme .nm{font-family:var(--display);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.scheme .axis{stroke:var(--line);stroke-width:1}
.scheme .lane{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.scheme .rme{fill:var(--accent);opacity:.14} .scheme .rbot{fill:var(--enemy);opacity:.14}
.scheme .dead{fill:var(--bg);opacity:.9}
.scheme .pme{fill:var(--accent)} .scheme .pbot{fill:var(--enemy)}
.scheme .sm{fill:var(--smoke);opacity:.45}
.scheme .steps{font-family:var(--mono);font-size:12px;fill:var(--fg)}
/* turn controls */
.turnHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.turnHead h2{margin:0}
.turnGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{min-width:0}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0}
.irow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ib{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:7px;padding:5px 2px 3px;font:inherit;cursor:pointer;display:grid;justify-items:center;gap:1px;min-width:0}
.ib svg{width:34px;height:20px;display:block}
.ib small{font-size:10px;color:var(--muted);line-height:1}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ib[aria-pressed="true"] small{color:var(--accent-fg)}
.ib.move[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ib.move[aria-pressed="true"] small{color:var(--bg)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.log.last{max-height:none;margin-bottom:4px}
#logMore summary{cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
/* log */
.log{font-family:var(--mono);font-size:12px;line-height:1.45;max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log .t{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.log .me{color:var(--accent)} .log .bot{color:var(--enemy)} .log .crit{color:var(--warn);font-weight:500}
.result{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;text-align:center;padding:8px 0}
.result.win{color:var(--good)} .result.lose{color:var(--accent)}
.score{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){ .hp i{transition:none} }
/* Side-on tactical stage. Labels belong to the scene, not a separate schematic. */
.view3d{position:relative;background:#34434a;border-radius:12px;isolation:isolate}
.scene-overlay{position:absolute;inset:0;pointer-events:none;color:#edf0e8;font-family:var(--body);background:linear-gradient(180deg,rgba(9,18,22,.26),transparent 22%,transparent 67%,rgba(9,18,22,.78))}
.scene-distance{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:9px;text-shadow:0 2px 4px #15232a}
.scene-distance strong{font:500 28px var(--display)}.scene-distance span{font-size:12px;white-space:nowrap}
.scene-unit{position:absolute;transform:translate(-50%,-100%);font-size:10px;font-weight:600;letter-spacing:.06em;padding:4px 7px;background:#15232bea;border-radius:3px;white-space:nowrap}
.unit-me{color:#ffc19e}.unit-bot{color:#a5dbff}
.scene-measure{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.scene-measure path{fill:none;stroke:#e1d8b5;stroke-width:1;stroke-dasharray:4 3}
.scene-ranges{position:absolute;bottom:32px;left:18px;right:18px;display:flex;justify-content:space-between;gap:20px;font-size:12px}
.scene-ranges>div{display:grid;grid-template-columns:auto auto;gap:3px 8px;align-items:center}.scene-ranges b{font-size:10px;letter-spacing:.06em}.scene-ranges strong{font-family:var(--mono);font-size:12px}.scene-ranges span{grid-column:1/-1;font-size:12px;color:#f0c9a6}.scene-ranges .can-fire span{color:#c3e3b8}.range-me{color:#ffc19e}.range-bot{color:#a5dbff;text-align:right}
.scene-scale{position:absolute;bottom:10px;left:18px;font-size:10px;color:#d1d9d8}
#setup{max-width:760px;margin-inline:auto}.fighters{max-width:740px;margin-inline:auto}.scene-heading{font-size:13px}
@media(min-width:850px){#turn,#logCard{display:inline-block;vertical-align:top;width:calc(50% - 8px)}#turn{margin-right:12px}#turn[hidden],#logCard[hidden]{display:none}}
@media(max-width:599px){body{padding-left:10px;padding-right:10px}.card{padding:10px}.scene-distance{gap:6px}.scene-distance strong{font-size:24px}.scene-distance span{font-size:10px}.scene-ranges{left:10px;right:10px;gap:10px}.scene-ranges>div{gap:3px 5px}.scene-ranges strong{font-size:11px}.scene-ranges b{font-size:9px}.scene-scale{left:10px}.scene-heading{font-size:11px}}

.scene-fullscreen{position:absolute;right:12px;top:12px;z-index:2;padding:6px 9px;border:1px solid #8fa5aa;border-radius:4px;background:#14232bd9;color:#eaf0ec;font:11px var(--body);cursor:pointer}.scene-fullscreen:focus-visible{outline:2px solid #e8c297;outline-offset:3px}.view3d:fullscreen{border-radius:0;margin:0;width:100vw;height:100vh}.view3d:fullscreen .scene-fullscreen{top:18px;right:18px}@media(max-width:599px){.scene-fullscreen{top:54px;font-size:10px}}
.back{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:8px}
</style>
</head>
<body>
<a class="back" href="index.html">← К карте</a>
<h1 id="title">MafiaCity · Дуэль</h1>
<p class="sub" id="subtitle">Прототип боя 1 на 1 против бота. Правила боя — черновик 1. <span id="ver" style="font-family:var(--mono)">v9</span></p>

<section class="card" id="setup">
  <h2>Ваше оружие</h2>
  <div class="row" id="wsel"></div>
  <h2 style="margin-top:14px">Противник</h2>
  <div class="row" id="bsel"></div>
  <h2 style="margin-top:14px">Место боя</h2>
  <div class="row" id="psel"></div>
  <label class="field" style="margin-top:12px"><input type="checkbox" id="smokeOn" checked> Взять дымовую гранату (1 на бой, у бота тоже есть)</label>
  <button class="btn" id="start">Начать бой</button>
  <p class="score" id="score"></p>
</section>

<section class="card" id="arena" hidden>
  <div class="fighters">
    <div class="fighter me"><div class="name">Вы</div><div class="w" id="meW"></div><div class="hp"><i id="meHp"></i></div><div class="hpn" id="meHpN"></div><div class="tags" id="meTags"></div></div>
    <div class="dist"><span id="dist">—</span><small>метров</small></div>
    <div class="fighter bot" style="text-align:right"><div class="name">Бот</div><div class="w" id="botW"></div><div class="hp"><i id="botHp"></i></div><div class="hpn" id="botHpN"></div><div class="tags" id="botTags" style="justify-content:flex-end"></div></div>
  </div>
  <div class="scene-heading"><span id="scenePlace"></span><span>Владивосток</span></div>
  <div class="view3d" id="view3d"></div>
  <div class="scheme" id="scheme"></div>
</section>

<section class="card" id="turn" hidden>
  <div class="turnHead"><h2 id="turnTitle">Ход 1</h2><span class="hint" id="shootHint"></span></div>
  <div class="turnGrid">
    <div class="col">
      <div class="lab">Сдвинуться</div>
      <div class="irow">
        <button class="ib move" data-m="L" title="Отпрыгнуть влево"><svg viewBox="0 0 40 24"><circle cx="28" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/><path d="M22 12H8" stroke="currentColor" stroke-width="2.2"/><path d="M12 7l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8" cy="12" r="3.2" fill="currentColor"/></svg><small>влево</small></button>
        <button class="ib move" data-m="C" aria-pressed="true" title="Остаться на месте"><svg viewBox="0 0 40 24"><circle cx="20" cy="12" r="4.2" fill="currentColor"/><circle cx="20" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><small>на месте</small></button>
        <button class="ib move" data-m="R" title="Отпрыгнуть вправо"><svg viewBox="0 0 40 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/><path d="M18 12h14" stroke="currentColor" stroke-width="2.2"/><path d="M28 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="32" cy="12" r="3.2" fill="currentColor"/></svg><small>вправо</small></button>
      </div>
      <label class="chk"><input type="checkbox" id="approach"> Подойти на 50 м</label>
      <label class="chk"><input type="checkbox" id="smoke"> Дым (вместо выстрела)</label>
    </div>
    <div class="col">
      <div class="lab" id="h1">Стрелять</div>
      <div class="irow">
        <button class="ib shoot" data-hand="1" data-d="L" title="Левее цели"><svg viewBox="0 0 40 24"><circle cx="26" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="26" cy="12" r="1.5" fill="currentColor"/><path d="M4 12h12" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="12" r="2.6" fill="currentColor"/></svg><small>левее</small></button>
        <button class="ib shoot" data-hand="1" data-d="C" title="В цель"><svg viewBox="0 0 40 24"><circle cx="20" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="12" r="2.6" fill="currentColor"/><path d="M20 2v4M20 18v4M10 12h4M26 12h4" stroke="currentColor" stroke-width="2"/></svg><small>в цель</small></button>
        <button class="ib shoot" data-hand="1" data-d="R" title="Правее цели"><svg viewBox="0 0 40 24"><circle cx="14" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="12" r="1.5" fill="currentColor"/><path d="M24 12h12" stroke="currentColor" stroke-width="2"/><circle cx="27" cy="12" r="2.6" fill="currentColor"/></svg><small>правее</small></button>
      </div>
      <div id="hand2" hidden>
        <div class="lab">Правая рука</div>
        <div class="irow">
          <button class="ib shoot" data-hand="2" data-d="L" title="Левее цели"><svg viewBox="0 0 40 24"><circle cx="26" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="26" cy="12" r="1.5" fill="currentColor"/><path d="M4 12h12" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="12" r="2.6" fill="currentColor"/></svg><small>левее</small></button>
          <button class="ib shoot" data-hand="2" data-d="C" title="В цель"><svg viewBox="0 0 40 24"><circle cx="20" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="12" r="2.6" fill="currentColor"/><path d="M20 2v4M20 18v4M10 12h4M26 12h4" stroke="currentColor" stroke-width="2"/></svg><small>в цель</small></button>
          <button class="ib shoot" data-hand="2" data-d="R" title="Правее цели"><svg viewBox="0 0 40 24"><circle cx="14" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="14" cy="12" r="1.5" fill="currentColor"/><path d="M24 12h12" stroke="currentColor" stroke-width="2"/><circle cx="27" cy="12" r="2.6" fill="currentColor"/></svg><small>правее</small></button>
        </div>
      </div>
    </div>
  </div>
  <button class="btn" id="go" style="margin-top:8px">Сделать ход</button>
</section>

<section class="card" id="logCard" hidden>
  <div class="result" id="result" hidden></div>
  <button class="btn secondary" id="again" hidden style="margin-bottom:10px">Новый бой</button>
  <div class="log last" id="logLast"></div>
  <details id="logMore"><summary class="hint">Весь журнал</summary><div class="log" id="log"></div></details>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
// MafiaCity: procedural city dioramas, Three.js r160. No external art assets.
// Public API: init(container), update(state), fx(event), dispose().
window.Scene3D = (() => {
  const LANES={L:-2.2,C:0,R:2.2}, P={skin:0xc69d7e,pants:0x25303a,boot:0x171e24,metal:0x303b43,wood:0x745039,me:0xb84c35,bot:0x427c99,camo:0x66705a};
  let renderer,scene,camera,world,observer,frame,state,ready=false,last=0,time=0;
  let figures={},effects=[],materials=new Map(),textures=new Map(),envKey='',figureKey='';
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  const v=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
  function mat(color,extra={}){const k=JSON.stringify([color,extra]);if(!materials.has(k))materials.set(k,new THREE.MeshStandardMaterial({color,roughness:.78,...extra}));return materials.get(k);}
  function mesh(p,geo,c,x=0,y=0,z=0,e={}){const m=new THREE.Mesh(geo,c?.isMaterial?c:mat(c,e));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;}
  const box=(p,w,h,d,c,x=0,y=0,z=0,e={})=>mesh(p,new THREE.BoxGeometry(w,h,d),c,x,y,z,e);
  const cyl=(p,a,b,h,c,x=0,y=0,z=0,n=10,e={})=>mesh(p,new THREE.CylinderGeometry(a,b,h,n),c,x,y,z,e);
  function ball(p,r,c,x,y,z,sx=1,sy=1,sz=1){const m=mesh(p,new THREE.SphereGeometry(r,12,8),c,x,y,z);m.scale.set(sx,sy,sz);return m;}
  function limb(p,a,b,r,c){const d=b.clone().sub(a),m=cyl(p,r*.88,r,d.length(),c);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(v(0,1,0),d.normalize());return m;}
  const glow=(p,w,h,d,c,x,y,z)=>box(p,w,h,d,c,x,y,z,{emissive:c,emissiveIntensity:1.5,roughness:.35});
  function release(g){if(!g)return;g.traverse(o=>{o.geometry?.dispose();if(o.userData.ownMaterial)o.material.dispose();});g.removeFromParent();}
  // Merge static objects sharing a material instead of one draw call per detail.
  function batchStatic(group){
    group.updateMatrixWorld(true);const buckets=new Map(),originals=[];
    group.traverse(o=>{if(!o.isMesh||o.userData.ownMaterial)return;const key=o.material.uuid;if(!buckets.has(key))buckets.set(key,{material:o.material,parts:[]});const geo=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();geo.applyMatrix4(o.matrixWorld);buckets.get(key).parts.push(geo);originals.push(o);});
    for(const {material,parts} of buckets.values()){const geo=new THREE.BufferGeometry();for(const name of ['position','normal','uv']){const size=parts[0].attributes[name].itemSize,total=parts.reduce((n,p)=>n+p.attributes[name].array.length,0),data=new Float32Array(total);let offset=0;for(const part of parts){data.set(part.attributes[name].array,offset);offset+=part.attributes[name].array.length;}geo.setAttribute(name,new THREE.BufferAttribute(data,size));}geo.computeBoundingSphere();const m=new THREE.Mesh(geo,material);m.castShadow=true;m.receiveShadow=true;group.add(m);parts.forEach(p=>p.dispose());}originals.forEach(release);return group;
  }
  function sign(p,text,w,h,x,y,z,rotation=0){let tex=textures.get(text);if(!tex){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#202f35';ctx.fillRect(0,0,512,128);ctx.fillStyle='#edc88f';ctx.font='600 56px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,66,472);tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;textures.set(text,tex);}const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));m.userData.ownMaterial=true;m.position.set(x,y,z);m.rotation.y=rotation;p.add(m);}
  // Seeded surface maps keep the look stable across turns and rebuilds.
  function surface(kind){
    if(materials.has('surface:'+kind))return materials.get('surface:'+kind);
    const canvas=document.createElement('canvas');canvas.width=canvas.height=256;const c=canvas.getContext('2d');let seed=1979;
    const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    const camo=kind==='camo'||kind==='enemy',base=camo?'#77765b':kind==='asphalt'?'#41474a':kind==='brick'?'#82766b':'#96988e';c.fillStyle=base;c.fillRect(0,0,256,256);
    if(camo){const colors=kind==='enemy'?['#424b46','#798078','#9b9d86','#535c52']:['#444c37','#989273','#b6ab86','#655d42'];for(let i=0;i<140;i++){c.fillStyle=colors[i%colors.length];const x=rnd()*256,y=rnd()*256,r=5+rnd()*21;c.beginPath();for(let j=0;j<10;j++){const a=j*Math.PI/5,rr=r*(.4+rnd()*.7);c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();c.fill();}}

<script>
const WEAPONS = {
  sniper:  {name:"Снайперская винтовка", short:"Снайперка", rng:500, min:100, dmg:70, bullets:1, stray:0},
  auto:    {name:"Автомат", short:"Автомат", rng:300, min:0, dmg:14, bullets:5, stray:.25},
  mg:      {name:"Пулемёт", short:"Пулемёт", rng:200, min:0, dmg:9, bullets:8, stray:.40},
  shotgun: {name:"Дробовик", short:"Дробовик", rng:100, min:0, dmg:6, bullets:10, stray:.65},
  pistols: {name:"Пара пистолетов", short:"Пистолеты", rng:120, min:0, dmg:35, bullets:1, stray:0, pair:true, focusMult:2.5},
};
const PLACES = {mall:{name:"Торговый центр", d:100}, street:{name:"Улица", d:300}, square:{name:"Площадь", d:500}};
const CRIT = .10, CRIT_MULT = 2, STEP = 50, SMOKE_TURNS = 2, HP = 100;
const DIRS = {L:"влево", C:"в центр", R:"вправо"}, MOVES = {L:"сдвинулся влево", C:"остался на месте", R:"сдвинулся вправо"};

const $ = id => document.getElementById(id);
let sel = {w:"auto", b:"shotgun", p:"street"};
let S = null; // battle state
let choice = {hands:{}, move:"C", approach:false, smoke:false};
let score = {w:0, l:0};
try { const s = JSON.parse(localStorage.getItem("mc_score")||"null"); if (s) score = s; } catch(e){}

function pick(container, items, key, cur, onPick){
  container.innerHTML = "";
  for (const [k,v] of Object.entries(items)){
    const b = document.createElement("button"); b.className="opt"; b.type="button"; b.id = key+"_"+k;
    b.setAttribute("aria-pressed", String(k===cur));
    b.innerHTML = v.rng ? `${v.short}<small>${v.rng} м · ${v.pair? v.dmg+"×2" : v.dmg+"×"+v.bullets}${v.stray?" · разброс "+Math.round(v.stray*100)+"%":""}${v.min?" · не ближе "+v.min+" м":""}</small>` : `${v.name}<small>старт ${v.d} м</small>`;
    b.onclick = () => { onPick(k); [...container.children].forEach(c=>c.setAttribute("aria-pressed", String(c===b))); };
    container.appendChild(b);
  }
}
pick($("wsel"), WEAPONS, "w", sel.w, k=>sel.w=k);
pick($("bsel"), WEAPONS, "b", sel.b, k=>sel.b=k);
pick($("psel"), PLACES, "p", sel.p, k=>sel.p=k);
const Q = new URLSearchParams(location.search);
const BOT_ID = Q.get("bot"), BOT_NAME = Q.get("name");
if (WEAPONS[Q.get("w")]) { sel.w=Q.get("w"); $("w_"+sel.w).click(); }
if (WEAPONS[Q.get("b")]) { sel.b=Q.get("b"); $("b_"+sel.b).click(); }
if (PLACES[Q.get("p")]) { sel.p=Q.get("p"); $("p_"+sel.p).click(); }
if (BOT_NAME) { $("subtitle").textContent = "Противник: "+BOT_NAME+", "+WEAPONS[sel.b].name+". "+PLACES[sel.p].name+"."; }
showScore();
function showScore(){ $("score").textContent = (score.w+score.l) ? `Счёт на этом телефоне: побед ${score.w}, поражений ${score.l}` : ""; }

function fighter(wk, smoke){ return {w:WEAPONS[wk], hp:HP, smokeLeft: smoke?1:0, smokeTurns:0}; }
function start(){
  S = {me:fighter(sel.w, $("smokeOn").checked), bot:fighter(sel.b, true), dist:PLACES[sel.p].d, turn:1, over:false};
  $("setup").hidden = true; $("arena").hidden = false; $("turn").hidden = false; $("logCard").hidden = false;
  $("log").innerHTML = ""; $("logLast").innerHTML = ""; lastTurn = []; $("result").hidden = true; $("again").hidden = true;
  $("meW").textContent = S.me.w.name; $("botW").textContent = S.bot.w.name; if (BOT_NAME) document.querySelector(".fighter.bot .name").textContent = BOT_NAME; $("scenePlace").textContent = PLACES[sel.p].name;
  $("hand2").hidden = !S.me.w.pair; $("h1").textContent = S.me.w.pair ? "Левая рука" : "Стрелять";
  logT(`${PLACES[sel.p].name}, старт ${S.dist} м`); showLast();
  resetChoice();
  if (!window.__scene3dReady){
    const v = $("view3d");
    if (!window.THREE){ v.innerHTML = '<p class="hint" style="padding:10px">3D-сцена не загрузилась: нет связи с библиотекой Three.js (блокировка сети или старый браузер).</p>'; }
    else if (!window.Scene3D){ v.innerHTML = '<p class="hint" style="padding:10px">3D-сцена не инициализировалась (Scene3D).</p>'; }
    else { try { window.__scene3dReady = Scene3D.init(v); } catch(e){ v.innerHTML = '<p class="hint" style="padding:10px">3D не запустилось: '+e.message+'</p>'; } }
  }
  render();
}
$("start").onclick = start;
if (BOT_ID) start();
$("again").onclick = () => { $("setup").hidden=false; $("arena").hidden=true; $("turn").hidden=true; $("logCard").hidden=true; showScore(); };

function canShoot(f, d){ return d <= f.w.rng && d >= f.w.min; }
function resetChoice(){ choice = {hands:{}, move:"C", approach:false, smoke:false}; }
function myShots(){ if (S.me.w.pair) return [choice.hands[1],choice.hands[2]].filter(Boolean); return choice.hands[1]?[choice.hands[1]]:[]; }

function render(){
  $("dist").textContent = S.dist;
  for (const [k,f] of [["me",S.me],["bot",S.bot]]){
    $(k+"Hp").style.width = Math.max(0,f.hp)+"%";
    $(k+"Hp").style.background = f.hp>50? "var(--good)" : f.hp>25? "var(--warn)" : "var(--accent)";
    $(k+"HpN").textContent = Math.max(0,f.hp)+" / "+HP;
    const t = [];
    t.push(`<span class="tag ${canShoot(f,S.dist)?"ok":"no"}">${canShoot(f,S.dist)?"достаёт":(S.dist>f.w.rng?"не достаёт":"слишком близко")}</span>`);
    if (f.smokeTurns>0) t.push(`<span class="tag smoke">в дыму ${f.smokeTurns}</span>`);
    if (f.smokeLeft) t.push(`<span class="tag">дым ×1</span>`);
    $(k+"Tags").innerHTML = t.join("");
  }
  $("turnTitle").textContent = "Ход "+S.turn;
  const me = S.me, shootable = canShoot(me, S.dist) && !choice.smoke;
  document.querySelectorAll(".shoot").forEach(b=>{ b.disabled = !shootable; b.setAttribute("aria-pressed", String(choice.hands[b.dataset.hand]===b.dataset.d)); });
  $("shootHint").textContent = choice.smoke ? "Этот ход — дымовая граната, выстрела нет." : !canShoot(me,S.dist) ? (S.dist>me.w.rng ? `Противник дальше ${me.w.rng} м — нужно подойти.` : `Ближе ${me.w.min} м ваше оружие не стреляет.`) : me.w.pair ? "Обе руки в одну точку — урон ×2,5." : "";
  document.querySelectorAll(".move").forEach(b=>b.setAttribute("aria-pressed", String(choice.move===b.dataset.m)));
  $("approach").checked = choice.approach; $("approach").disabled = S.dist<=0;
  $("smoke").checked = choice.smoke; $("smoke").disabled = !me.smokeLeft && !choice.smoke;
  $("turn").hidden = S.over;
  drawScheme();
  if (window.__scene3dReady) Scene3D.update({dist:S.dist, maxD:PLACES[sel.p].d, place:sel.p, me:{w:sel.w, lane:S.lastMe||"C", smoke:S.me.smokeTurns, hp:S.me.hp, rng:S.me.w.rng, min:S.me.w.min}, bot:{w:sel.b, lane:S.lastBot||"C", smoke:S.bot.smokeTurns, hp:S.bot.hp, rng:S.bot.w.rng, min:S.bot.w.min}});
}
function drawScheme(){
  const W=520, H=150, L=24, R=W-24, top=40, bot=120;
  const maxD = Math.max(PLACES[sel.p].d, 100), px = m => L + (R-L)*m/maxD;
  const me=S.me, bo=S.bot, d=S.dist;
  const laneY = {L:top+14, C:(top+bot)/2, R:bot-14};
  const myY = laneY[S.lastMe||"C"], botY = laneY[S.lastBot||"C"];
  const meRange = `<rect class="rme" x="${px(0)}" y="${top}" width="${px(Math.min(me.w.rng,maxD))-px(0)}" height="${bot-top}" rx="4"/>` +
    (me.w.min ? `<rect class="dead" x="${px(0)}" y="${top}" width="${px(me.w.min)-px(0)}" height="${bot-top}"/><text class="lbl" x="${px(me.w.min)-2}" y="${top-6}" text-anchor="end">мёртвая зона ${me.w.min} м</text>` : "");
  const botRange = `<rect class="rbot" x="${px(Math.max(0,d-bo.w.rng))}" y="${top}" width="${px(d)-px(Math.max(0,d-bo.w.rng))}" height="${bot-top}" rx="4"/>`;
  const meHits = canShoot(me,d), botHits = canShoot(bo,d);
  const stepsBot = d>bo.w.rng ? Math.ceil((d-bo.w.rng)/STEP) : 0, stepsMe = d>me.w.rng ? Math.ceil((d-me.w.rng)/STEP) : 0;
  const ticks = [0,100,200,300,400,500].filter(t=>t<=maxD).map(t=>`<line class="axis" x1="${px(t)}" y1="${bot}" x2="${px(t)}" y2="${bot+5}"/><text class="lbl" x="${px(t)}" y="${bot+17}" text-anchor="middle">${t}</text>`).join("");
  const smokeMe = me.smokeTurns>0 ? `<circle class="sm" cx="${px(0)}" cy="${myY}" r="22"/>` : "";
  const smokeBot = bo.smokeTurns>0 ? `<circle class="sm" cx="${px(d)}" cy="${botY}" r="22"/>` : "";
  const lanes = ["L","C","R"].map(k=>`<line class="lane" x1="${L}" y1="${laneY[k]}" x2="${R}" y2="${laneY[k]}"/>`).join("");
  const laneLbl = `<text class="lbl" x="${R+2}" y="${laneY.L+4}" text-anchor="start">л</text><text class="lbl" x="${R+2}" y="${laneY.C+4}" text-anchor="start">ц</text><text class="lbl" x="${R+2}" y="${laneY.R+4}" text-anchor="start">п</text>`;
  const info = `<text class="steps" x="${(px(0)+px(d))/2}" y="${top-8}" text-anchor="middle">${d} м · ${botHits?"бот достаёт":"боту идти "+stepsBot+" х."} · ${meHits?"вы достаёте":"вам идти "+stepsMe+" х."}</text>`;
  $("scheme").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема боя: дистанция ${d} м">
    ${meRange}${botRange}${lanes}<line class="axis" x1="${L}" y1="${bot}" x2="${R}" y2="${bot}"/>${ticks}${laneLbl}
    ${smokeMe}${smokeBot}
    <circle class="pme" cx="${px(0)}" cy="${myY}" r="8"/><text class="nm pme" x="${px(0)}" y="${bot+32}" text-anchor="middle">Вы</text>
    <circle class="pbot" cx="${px(d)}" cy="${botY}" r="8"/><text class="nm pbot" x="${px(d)}" y="${bot+32}" text-anchor="middle">Бот</text>
    ${info}</svg>
  <p class="hint">Светлая полоса слева — куда достаёте вы, справа — куда достаёт бот. Дорожки: лево / центр / право, кружок стоит там, куда боец сдвинулся на прошлом ходу.</p>`;
}
document.querySelectorAll(".shoot").forEach(b=>b.onclick=()=>{
  const h=b.dataset.hand, d=b.dataset.d;
  choice.hands[h] = (choice.hands[h]===d) ? undefined : d;
  render();
});
document.querySelectorAll(".move").forEach(b=>b.onclick=()=>{ choice.move=b.dataset.m; render(); });
$("approach").onchange=e=>{ choice.approach=e.target.checked; render(); };
$("smoke").onchange=e=>{ choice.smoke=e.target.checked; if (choice.smoke) choice.hands={}; render(); };

// --- bot brain: simple but not stupid
function botPlan(){
  const b=S.bot, m=S.me, plan={shoot:[], move:["L","C","R"][Math.floor(Math.random()*3)], approach:false, smoke:false};
  if (!canShoot(b,S.dist)){
    if (S.dist>b.w.rng){
      plan.approach = true;
      if (b.smokeLeft && b.smokeTurns===0 && canShoot(m,S.dist)) plan.smoke = true; // under fire while walking → smoke
    }
    return plan;
  }
  const rnd=()=>["L","C","R"][Math.floor(Math.random()*3)];
  plan.shoot = b.w.pair ? [rnd(), rnd()] : [rnd()];
  if (S.dist > m.w.rng && b.w.rng >= S.dist) plan.approach=false; // bot has the range edge: hold it
  else if (S.dist > b.w.rng) plan.approach=true;
  return plan;
}

// --- damage of one shooter against target, returns {dmg, text}
function fire(shooter, target, plan, targetMove){
  const w=shooter.w, vis = target.smokeTurns>0 ? 0 : 1;
  let dmg=0, crits=0, hitBullets=0, guessed=false;
  const bullet = () => { const c = Math.random()<CRIT; if (c) crits++; hitBullets++; return w.dmg*(c?CRIT_MULT:1); };
  if (w.pair){
    const hitAny = plan.shoot.includes(targetMove);
    if (hitAny && Math.random()<vis){
      guessed=true;
      const focus = plan.shoot.length===2 && plan.shoot[0]===plan.shoot[1];
      dmg = Math.round(bullet()*(focus?w.focusMult:1));
    }
    return {dmg, guessed, crits, hitBullets};
  }
  guessed = plan.shoot[0]===targetMove;
  if (guessed){ if (Math.random()<vis) for(let i=0;i<w.bullets;i++) dmg+=bullet(); else guessed="blind"; }
  else for(let i=0;i<w.bullets;i++) if (Math.random()<w.stray*vis) dmg+=bullet();
  return {dmg:Math.round(dmg), guessed, crits, hitBullets};
}
function lineText(who, r, plan, moveKey, approach, tgt){
  const parts = [];
  if (plan.smoke) parts.push(`бросает дым (${tgt} не виден 2 хода)`);
  else if (plan.shoot.length){
    const focus = plan.shoot.length===2 && plan.shoot[0]===plan.shoot[1];
    const where = focus ? DIRS[plan.shoot[0]]+" с двух рук" : plan.shoot.map(d=>DIRS[d]).join(" и ");
    let s = `стреляет ${where} — `;
    if (r.guessed==="blind") s += "угадал, но цель в дыму, промах";
    else if (r.guessed) s += `угадал, −${r.dmg}`;
    else s += r.dmg>0 ? `не угадал, задел ${r.hitBullets} пул., −${r.dmg}` : "промах";
    if (r.crits) s += ` <span class="crit">(крит ×${r.crits})</span>`;
    parts.push(s);
  }
  parts.push(MOVES[moveKey]);
  if (approach) parts.push("подошёл на 50 м");
  return `${who}: ${parts.join("; ")}`;
}
$("go").onclick = () => {
  if (S.over) return;
  const me=S.me, bot=S.bot;
  if (!choice.smoke && canShoot(me,S.dist)){
    const need = me.w.pair ? 2 : 1;
    if (myShots().length<need){ $("shootHint").textContent = need===2 ? "Выберите позицию для каждой руки." : "Выберите, куда стрелять."; return; }
  }
  const bp = botPlan();
  logT(`Ход ${S.turn} · дистанция ${S.dist} м`);
  // smoke applied first
  if (choice.smoke && me.smokeLeft){ me.smokeLeft=0; me.smokeTurns=SMOKE_TURNS; }
  if (bp.smoke && bot.smokeLeft){ bot.smokeLeft=0; bot.smokeTurns=SMOKE_TURNS; }
  // shots (simultaneous)
  const myPlan = {shoot: choice.smoke?[]:myShots(), smoke:choice.smoke};
  const rMe = (myPlan.shoot.length && canShoot(me,S.dist)) ? fire(me, bot, myPlan, bp.move) : {dmg:0,guessed:false,crits:0,hitBullets:0};
  const rBot = (bp.shoot.length && canShoot(bot,S.dist)) ? fire(bot, me, bp, choice.move) : {dmg:0,guessed:false,crits:0,hitBullets:0};
  log(`<span class="me">${lineText("Вы", rMe, myPlan, choice.move, choice.approach, "бот")}</span>`);
  log(`<span class="bot">${lineText("Бот", rBot, bp, bp.move, bp.approach, "вы")}</span>`);
  if (window.__scene3dReady){ for (const d of myPlan.shoot) Scene3D.fx({from:"me", lane:d, hit:rMe.dmg>0}); for (const d of bp.shoot) Scene3D.fx({from:"bot", lane:d, hit:rBot.dmg>0}); }
  bot.hp -= rMe.dmg; me.hp -= rBot.dmg;
  S.lastMe = choice.move; S.lastBot = bp.move;
  // distance
  let d = S.dist; if (choice.approach) d-=STEP; if (bp.approach) d-=STEP; S.dist = Math.max(0,d);
  // smoke tick
  if (me.smokeTurns>0) me.smokeTurns--; if (bot.smokeTurns>0) bot.smokeTurns--;
  S.turn++;
  if (me.hp<=0 || bot.hp<=0){
    S.over=true;
    const win = bot.hp<=0 && me.hp>0, draw = bot.hp<=0 && me.hp<=0;
    $("result").hidden=false; $("result").className = "result "+(win?"win":"lose");
    $("result").textContent = draw ? "Ничья — оба легли" : win ? "Победа" : "Поражение";
    if (!draw){ if (win) score.w++; else score.l++; try{ localStorage.setItem("mc_score", JSON.stringify(score)); if (BOT_ID){ const r=JSON.parse(localStorage.getItem("mc_results")||"{}"); r[BOT_ID]={win, t:Date.now()}; localStorage.setItem("mc_results", JSON.stringify(r)); } }catch(e){} }
    $("again").hidden=false;
  }
  resetChoice(); render();
  $("log").scrollTop = 0;
  showLast();
};
let lastTurn = [];
function log(html){ const p=document.createElement("div"); p.innerHTML=html; $("log").prepend(p); lastTurn.push(html); }
function logT(t){ const p=document.createElement("div"); p.className="t"; p.textContent=t; $("log").prepend(p); lastTurn = []; lastTurn.push('<div class="t">'+t+'</div>'); }
function showLast(){ $("logLast").innerHTML = lastTurn.map(h=>h.startsWith('<div class="t">')?h:'<div>'+h+'</div>').join(""); }
</script>
