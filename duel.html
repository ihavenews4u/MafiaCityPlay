<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MafiaCity — дуэль</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;font-size:15px;line-height:1.4}
h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}
h2{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1 1 auto;min-width:0;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:10px 8px;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.opt small{display:block;color:var(--muted);font-size:12px;font-family:var(--mono)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:focus-visible,.btn:focus-visible,.dir:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg);width:100%}
.btn.secondary{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.field{display:block;margin-bottom:10px}
/* arena */
.fighters{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.fighter{min-width:0}
.fighter .name{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.fighter.me .name{color:var(--accent)} .fighter.bot .name{color:var(--enemy)}
.fighter .w{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hp{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}
.hp i{display:block;height:100%;background:var(--good);transition:width .3s}
.hpn{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.dist{text-align:center;font-family:var(--display);font-size:30px;line-height:1;padding-top:4px;font-variant-numeric:tabular-nums}
.dist small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.smoke{border-color:var(--smoke);color:var(--smoke)}
.tag.ok{border-color:var(--good);color:var(--good)} .tag.no{border-color:var(--warn);color:var(--warn)}
.view3d{margin-top:12px;border-radius:8px;overflow:hidden;background:var(--line)}
.view3d canvas{display:block}
/* scheme */
.scheme{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.scheme svg{width:100%;height:auto;display:block}
.scheme .lbl{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.scheme .nm{font-family:var(--display);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.scheme .axis{stroke:var(--line);stroke-width:1}
.scheme .lane{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.scheme .rme{fill:var(--accent);opacity:.14} .scheme .rbot{fill:var(--enemy);opacity:.14}
.scheme .dead{fill:var(--bg);opacity:.9}
.scheme .pme{fill:var(--accent)} .scheme .pbot{fill:var(--enemy)}
.scheme .sm{fill:var(--smoke);opacity:.45}
.scheme .steps{font-family:var(--mono);font-size:12px;fill:var(--fg)}
/* turn controls */
.turnGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.vcol{display:grid;gap:6px}
.col{min-width:0}
.dir{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:14px 6px;font:inherit;font-weight:500;cursor:pointer}
.dir[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.dir.move[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dir:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.extra{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.extra .opt{flex:1 1 120px;text-align:center}
.extra .opt.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
/* log */
.log{font-family:var(--mono);font-size:13px;line-height:1.5;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log .t{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.log .me{color:var(--accent)} .log .bot{color:var(--enemy)} .log .crit{color:var(--warn);font-weight:500}
.result{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;text-align:center;padding:8px 0}
.result.win{color:var(--good)} .result.lose{color:var(--accent)}
.score{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){ .hp i{transition:none} }
.back{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;margin-bottom:8px}
</style>
</head>
<body>
<a class="back" href="index.html">← К карте</a>
<h1 id="title">MafiaCity · Дуэль</h1>
<p class="sub" id="subtitle">Прототип боя 1 на 1 против бота. Правила боя — черновик 1.</p>

<section class="card" id="setup">
  <h2>Ваше оружие</h2>
  <div class="row" id="wsel"></div>
  <h2 style="margin-top:14px">Противник</h2>
  <div class="row" id="bsel"></div>
  <h2 style="margin-top:14px">Место боя</h2>
  <div class="row" id="psel"></div>
  <label class="field" style="margin-top:12px"><input type="checkbox" id="smokeOn" checked> Взять дымовую гранату (1 на бой, у бота тоже есть)</label>
  <button class="btn" id="start">Начать бой</button>
  <p class="score" id="score"></p>
</section>

<section class="card" id="arena" hidden>
  <div class="fighters">
    <div class="fighter me"><div class="name">Вы</div><div class="w" id="meW"></div><div class="hp"><i id="meHp"></i></div><div class="hpn" id="meHpN"></div><div class="tags" id="meTags"></div></div>
    <div class="dist"><span id="dist">—</span><small>метров</small></div>
    <div class="fighter bot" style="text-align:right"><div class="name">Бот</div><div class="w" id="botW"></div><div class="hp"><i id="botHp"></i></div><div class="hpn" id="botHpN"></div><div class="tags" id="botTags" style="justify-content:flex-end"></div></div>
  </div>
  <div class="view3d" id="view3d"></div>
  <div class="scheme" id="scheme"></div>
</section>

<section class="card" id="turn" hidden>
  <h2 id="turnTitle">Ход 1</h2>
  <div class="turnGrid">
    <div class="col"><div class="hint" id="h1">Куда стрелять</div>
      <div class="vcol">
        <button class="dir shoot" data-hand="1" data-d="L">▲ Влево</button>
        <button class="dir shoot" data-hand="1" data-d="C">В центр</button>
        <button class="dir shoot" data-hand="1" data-d="R">▼ Вправо</button>
      </div></div>
    <div class="col" id="hand2" hidden><div class="hint">Правая рука</div>
      <div class="vcol">
        <button class="dir shoot" data-hand="2" data-d="L">▲ Влево</button>
        <button class="dir shoot" data-hand="2" data-d="C">В центр</button>
        <button class="dir shoot" data-hand="2" data-d="R">▼ Вправо</button>
      </div></div>
    <div class="col"><div class="hint">Куда сдвинуться</div>
      <div class="vcol">
        <button class="dir move" data-m="L">▲ Влево</button>
        <button class="dir move" data-m="C" aria-pressed="true">Остаться</button>
        <button class="dir move" data-m="R">▼ Вправо</button>
      </div></div>
  </div>
  <p class="hint" id="shootHint"></p>
  <div class="extra">
    <button class="opt" id="approach">Подойти <small>+50 м ближе</small></button>
    <button class="opt" id="smoke">Дым <small>вместо выстрела, 2 хода</small></button>
  </div>
  <button class="btn" id="go" style="margin-top:12px">Сделать ход</button>
</section>

<section class="card" id="logCard" hidden>
  <div class="result" id="result" hidden></div>
  <button class="btn secondary" id="again" hidden style="margin-bottom:10px">Новый бой</button>
  <h2>Журнал боя</h2>
  <div class="log" id="log"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</body>
</html>
<script>
// MafiaCity — 3D-сцена боя (лоу-поли, Three.js). Подключается к duel.html.
// Вызовы: Scene3D.init(container), Scene3D.update(state), Scene3D.fx(event)
// state: {dist, maxD, place, me:{w, lane, smoke, hp}, bot:{w, lane, smoke, hp}}
window.Scene3D = (() => {
  let renderer, scene, camera, root, env, figs = {}, smokes = {}, tracers = [], ready = false, cur = null;
  const LANE_X = {L:-2.2, C:0, R:2.2};
  const C = {
    skin:0xd9b48f, pants:0x2d3140, boot:0x1a1a1a, metal:0x3a3d44, wood:0x6b4a2b,
    me:0xb23a1e, bot:0x2d5f8a, camo:0x5b6b3a, armor:0x2b2b2b, smoke:0x8a8a8a,
  };
  const mat = (c, extra={}) => new THREE.MeshLambertMaterial({color:c, ...extra});
  const box = (w,h,d,c,x=0,y=0,z=0) => { const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c)); m.position.set(x,y,z); m.castShadow=true; return m; };
  const cyl = (r,h,c,x=0,y=0,z=0) => { const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,10), mat(c)); m.position.set(x,y,z); m.castShadow=true; return m; };

  // ---------- фигура бойца ----------
  function figure(side, wkey, gear){
    const g = new THREE.Group();
    const teamC = side==="me" ? C.me : C.bot;
    const bodyC = gear.camo ? C.camo : teamC;
    const legs = box(0.5,0.9,0.3,C.pants,0,0.45,0); g.add(legs);
    g.add(box(0.55,0.15,0.35,C.boot,0,0.07,0));
    const torso = box(0.7,0.9,0.4,bodyC,0,1.35,0); g.add(torso);
    if (gear.armor) g.add(box(0.74,0.6,0.46,C.armor,0,1.4,0));
    const head = box(0.4,0.4,0.4,C.skin,0,2.0,0); g.add(head);
    const cap = box(0.44,0.12,0.44, gear.camo?C.camo:teamC, 0,2.24,0); g.add(cap);
    if (gear.thermal){ const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8), new THREE.MeshBasicMaterial({color:0x7cf27c})); eye.position.set(0.14,2.05,0.22); g.add(eye); }
    // руки + оружие (направлены к противнику: +z для me, -z для bot — поворачиваем группу)
    const arms = new THREE.Group(); arms.position.set(0,1.5,0);
    const armL = box(0.18,0.18,0.9,bodyC,-0.3,0,0.4), armR = box(0.18,0.18,0.9,bodyC,0.3,0,0.4);
    arms.add(armL, armR);
    const wp = weapon(wkey); wp.position.set(0.1,0.05,0.6); arms.add(wp);
    if (wkey==="pistols"){ const wp2 = weapon("pistols"); wp2.position.set(-0.3,0.05,0.6); arms.add(wp2); }
    g.add(arms);
    g.userData = {arms, torso, legs};
    return g;
  }
  function weapon(k){
    const g = new THREE.Group();
    switch(k){
      case "sniper": g.add(cyl(0.05,2.2,C.metal,0,0,0.6)); g.add(box(0.1,0.18,0.6,C.wood,0,-0.1,-0.3)); g.add(cyl(0.07,0.5,C.metal,0,0.15,0.2)); break; // длинный ствол + прицел
      case "auto":   g.add(cyl(0.05,1.3,C.metal,0,0,0.3)); g.add(box(0.1,0.18,0.5,C.wood,0,-0.1,-0.3)); g.add(box(0.08,0.35,0.12,C.metal,0,-0.25,0.1)); break; // магазин
      case "mg":     g.add(cyl(0.07,1.5,C.metal,0,0,0.3)); g.add(box(0.14,0.22,0.5,C.metal,0,-0.1,-0.3)); g.add(box(0.3,0.25,0.3,C.metal,0,-0.2,0)); g.add(cyl(0.02,0.4,C.metal,0.1,-0.3,0.6)); g.add(cyl(0.02,0.4,C.metal,-0.1,-0.3,0.6)); break; // короб + сошки
      case "shotgun":g.add(cyl(0.07,0.9,C.metal,0,0,0.2)); g.add(cyl(0.07,0.9,C.metal,0,-0.1,0.2)); g.add(box(0.12,0.2,0.5,C.wood,0,-0.1,-0.35)); break; // два ствола
      case "pistols":g.add(box(0.08,0.1,0.35,C.metal,0,0,0.1)); g.add(box(0.07,0.25,0.1,C.metal,0,-0.15,-0.05)); break;
      default: g.add(cyl(0.05,1.0,C.metal,0,0,0.3));
    }
    for (const m of g.children){ m.rotation.x = m.geometry.type==="CylinderGeometry" ? Math.PI/2 : 0; }
    return g;
  }

  // ---------- окружение ----------
  function environment(place, maxD){
    const g = new THREE.Group();
    const len = maxD/10 + 8; // 10 м = 1 ед.
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, len+6), mat(place==="mall"?0xd9d4c7: place==="square"?0x9aa39c:0x4a4d52));
    ground.rotation.x = -Math.PI/2; ground.position.z = len/2 - 2; ground.receiveShadow = true; g.add(ground);
    // дорожки
    for (const x of Object.values(LANE_X)){ const l = new THREE.Mesh(new THREE.PlaneGeometry(0.06, len+4), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.25})); l.rotation.x=-Math.PI/2; l.position.set(x,0.01,len/2-2); g.add(l); }
    if (place==="mall"){
      // стены, витрины, колонны
      for (const sx of [-6.5,6.5]){ g.add(box(0.3, 4, len+6, 0xcfc6b4, sx, 2, len/2-2)); }
      for (let z=0; z<len; z+=4){ for (const sx of [-5.6,5.6]){ g.add(box(0.5,3.2,0.5,0xbdb3a0,sx,1.6,z)); const win = box(0.1,1.6,2.2,0x7fb3d5,sx*1.1,1.8,z+2); g.add(win);} }
      const roof = new THREE.Mesh(new THREE.PlaneGeometry(14,len+6), mat(0xe8e3d8)); roof.rotation.x=Math.PI/2; roof.position.set(0,4,len/2-2); g.add(roof);
    } else if (place==="square"){
      // набережная/площадь: вода справа, парапет, фонари, скамейки
      const water = new THREE.Mesh(new THREE.PlaneGeometry(20, len+10), mat(0x3f6f8f)); water.rotation.x=-Math.PI/2; water.position.set(16,-0.05,len/2-2); g.add(water);
      g.add(box(0.4,0.9,len+6,0x8f8f8a,6.8,0.45,len/2-2));
      for (let z=0; z<len; z+=6){ g.add(cyl(0.08,4,0x2a2a2a,-6,2,z)); const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8), new THREE.MeshBasicMaterial({color:0xfff2b0})); lamp.position.set(-6,4,z); g.add(lamp); g.add(box(1.4,0.1,0.5,0x6b4a2b,5.5,0.5,z+3)); }
    } else {
      // улица: дома по бокам, припаркованные машины, разметка
      for (let z=0; z<len; z+=7){ for (const sx of [-1,1]){ const h=4+((z*7)%9); const b=box(5,h,6,[0x8c7b6b,0x9a8f84,0x7a6f68][(z/7|0)%3], sx*9, h/2, z+3); g.add(b);
        for (let wy=1.5; wy<h-0.5; wy+=1.5) for (let wz=-2; wz<=2; wz+=1.5){ const w=box(0.1,0.8,0.8,0xbfe1ff, sx*6.45, wy, z+3+wz); g.add(w);} } }
      for (let z=2; z<len; z+=9){ g.add(box(1.8,0.6,4.2,[0xc23b3b,0x3b5fc2,0xdddddd][(z/9|0)%3],-4.8,0.5,z)); g.add(box(1.6,0.5,2.0,0x222222,-4.8,0.95,z)); }
      for (let z=0; z<len; z+=2){ const m = new THREE.Mesh(new THREE.PlaneGeometry(0.12,1), new THREE.MeshBasicMaterial({color:0xe6d35a})); m.rotation.x=-Math.PI/2; m.position.set(3.6,0.02,z); g.add(m); }
    }
    return g;
  }

  function init(container){
    if (!window.THREE) return false;
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.innerHTML = ""; container.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
    const amb = new THREE.HemisphereLight(0xffffff, 0x556070, 0.9); scene.add(amb);
    const sun = new THREE.DirectionalLight(0xfff4e0, 0.9); sun.position.set(5,12,-6); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
    const s = sun.shadow.camera; s.left=-20; s.right=20; s.top=60; s.bottom=-10; scene.add(sun);
    root = new THREE.Group(); scene.add(root);
    const ro = new ResizeObserver(resize); ro.observe(container);
    resize(); ready = true; animate();
    return true;
  }
  function resize(){ const el = renderer.domElement.parentElement; const w = el.clientWidth || el.parentElement.clientWidth || 360, h = Math.max(220, Math.round(w*0.62)); renderer.setSize(w,h,false); renderer.domElement.style.width="100%"; renderer.domElement.style.height=h+"px"; camera.aspect=w/h; camera.updateProjectionMatrix(); }

  function update(st){
    if (!ready) return;
    cur = st;
    const key = st.place+"|"+st.maxD+"|"+st.me.w+"|"+st.bot.w;
    if (root.userData.key !== key){
      root.clear(); figs = {}; smokes = {};
      env = environment(st.place, st.maxD); root.add(env);
      scene.background = new THREE.Color(st.place==="mall"?0xe9e4da: st.place==="square"?0xbfd6e6:0x9fb0c0);
      scene.fog = new THREE.Fog(scene.background.getHex(), 30, 90);
      figs.me = figure("me", st.me.w, st.me.gear||{}); root.add(figs.me);
      figs.bot = figure("bot", st.bot.w, st.bot.gear||{}); figs.bot.rotation.y = Math.PI; root.add(figs.bot);
      root.userData.key = key;
    }
    figs.me.userData.target = new THREE.Vector3(LANE_X[st.me.lane||"C"], 0, 0);
    figs.bot.userData.target = new THREE.Vector3(LANE_X[st.bot.lane||"C"], 0, st.dist/10);
    for (const k of ["me","bot"]){
      const f = figs[k];
      const want = st[k].smoke>0;
      if (want && !smokes[k]){ const sm = new THREE.Group(); for (let i=0;i<7;i++){ const p = new THREE.Mesh(new THREE.SphereGeometry(0.7+Math.random()*0.5,8,8), new THREE.MeshLambertMaterial({color:C.smoke, transparent:true, opacity:.55})); p.position.set((Math.random()-.5)*2.2, 0.6+Math.random()*1.6, (Math.random()-.5)*2.2); sm.add(p);} f.add(sm); smokes[k]=sm; }
      if (!want && smokes[k]){ f.remove(smokes[k]); delete smokes[k]; }
      f.visible = st[k].hp > 0;
    }
  }
  function fx(ev){
    // ev: {from:"me"|"bot", lane:"L"|"C"|"R", hit:boolean}
    if (!ready || !figs.me) return;
    const from = figs[ev.from], toZ = ev.from==="me" ? (cur.dist/10) : 0;
    const a = from.position.clone().add(new THREE.Vector3(0,1.55,0));
    const b = new THREE.Vector3(LANE_X[ev.lane], 1.4, toZ);
    const geo = new THREE.BufferGeometry().setFromPoints([a,b]);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color: ev.hit?0xffd36b:0xffffff, transparent:true, opacity:1}));
    root.add(line); tracers.push({line, t:0});
    const flash = new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8), new THREE.MeshBasicMaterial({color:0xfff0a0})); flash.position.copy(a).add(new THREE.Vector3(0,0,ev.from==="me"?1.2:-1.2)); root.add(flash); tracers.push({line:flash, t:0, flash:true});
  }
  function animate(){
    requestAnimationFrame(animate);
    if (!cur) { renderer.render(scene,camera); return; }
    for (const k of ["me","bot"]){ const f=figs[k]; if (!f||!f.userData.target) continue; f.position.lerp(f.userData.target, 0.12); }
    for (let i=tracers.length-1;i>=0;i--){ const t=tracers[i]; t.t+=0.04; const o=Math.max(0,1-t.t); if (t.flash){ t.line.scale.setScalar(1+t.t*3); t.line.material.opacity=o; t.line.material.transparent=true; } else t.line.material.opacity=o; if (t.t>=1){ root.remove(t.line); tracers.splice(i,1); } }
    // камера: сзади-сверху за игроком, смотрит на середину дистанции
    const bz = figs.bot ? figs.bot.position.z : 10;
    const mx = figs.me ? figs.me.position.x : 0;
    // камера за плечом своего бойца: он всегда крупный, дистанция читается перспективой
    camera.position.lerp(new THREE.Vector3(mx + 3.2, 2.6, -4.2), 0.08);
    camera.lookAt(mx*0.3, 1.3, Math.min(bz, 18)*0.5 + 2);
    renderer.render(scene,camera);
  }
  return {init, update, fx};
})();

</script>
</body>
</html>
<script>
const WEAPONS = {
  sniper:  {name:"Снайперская винтовка", short:"Снайперка", rng:500, min:100, dmg:70, bullets:1, stray:0},
  auto:    {name:"Автомат", short:"Автомат", rng:300, min:0, dmg:14, bullets:5, stray:.25},
  mg:      {name:"Пулемёт", short:"Пулемёт", rng:200, min:0, dmg:9, bullets:8, stray:.40},
  shotgun: {name:"Дробовик", short:"Дробовик", rng:100, min:0, dmg:6, bullets:10, stray:.65},
  pistols: {name:"Пара пистолетов", short:"Пистолеты", rng:120, min:0, dmg:35, bullets:1, stray:0, pair:true, focusMult:2.5},
};
const PLACES = {mall:{name:"Торговый центр", d:100}, street:{name:"Улица", d:300}, square:{name:"Площадь", d:500}};
const CRIT = .10, CRIT_MULT = 2, STEP = 50, SMOKE_TURNS = 2, HP = 100;
const DIRS = {L:"влево", C:"в центр", R:"вправо"}, MOVES = {L:"сдвинулся влево", C:"остался на месте", R:"сдвинулся вправо"};

const $ = id => document.getElementById(id);
let sel = {w:"auto", b:"shotgun", p:"street"};
let S = null; // battle state
let choice = {hands:{}, move:"C", approach:false, smoke:false};
let score = {w:0, l:0};
try { const s = JSON.parse(localStorage.getItem("mc_score")||"null"); if (s) score = s; } catch(e){}

function pick(container, items, key, cur, onPick){
  container.innerHTML = "";
  for (const [k,v] of Object.entries(items)){
    const b = document.createElement("button"); b.className="opt"; b.type="button"; b.id = key+"_"+k;
    b.setAttribute("aria-pressed", String(k===cur));
    b.innerHTML = v.rng ? `${v.short}<small>${v.rng} м · ${v.pair? v.dmg+"×2" : v.dmg+"×"+v.bullets}${v.stray?" · разброс "+Math.round(v.stray*100)+"%":""}${v.min?" · не ближе "+v.min+" м":""}</small>` : `${v.name}<small>старт ${v.d} м</small>`;
    b.onclick = () => { onPick(k); [...container.children].forEach(c=>c.setAttribute("aria-pressed", String(c===b))); };
    container.appendChild(b);
  }
}
pick($("wsel"), WEAPONS, "w", sel.w, k=>sel.w=k);
pick($("bsel"), WEAPONS, "b", sel.b, k=>sel.b=k);
pick($("psel"), PLACES, "p", sel.p, k=>sel.p=k);
const Q = new URLSearchParams(location.search);
const BOT_ID = Q.get("bot"), BOT_NAME = Q.get("name");
if (WEAPONS[Q.get("w")]) { sel.w=Q.get("w"); $("w_"+sel.w).click(); }
if (WEAPONS[Q.get("b")]) { sel.b=Q.get("b"); $("b_"+sel.b).click(); }
if (PLACES[Q.get("p")]) { sel.p=Q.get("p"); $("p_"+sel.p).click(); }
if (BOT_NAME) { $("subtitle").textContent = "Противник: "+BOT_NAME+", "+WEAPONS[sel.b].name+". "+PLACES[sel.p].name+"."; }
showScore();
function showScore(){ $("score").textContent = (score.w+score.l) ? `Счёт на этом телефоне: побед ${score.w}, поражений ${score.l}` : ""; }

function fighter(wk, smoke){ return {w:WEAPONS[wk], hp:HP, smokeLeft: smoke?1:0, smokeTurns:0}; }
function start(){
  S = {me:fighter(sel.w, $("smokeOn").checked), bot:fighter(sel.b, true), dist:PLACES[sel.p].d, turn:1, over:false};
  $("setup").hidden = true; $("arena").hidden = false; $("turn").hidden = false; $("logCard").hidden = false;
  $("log").innerHTML = ""; $("result").hidden = true; $("again").hidden = true;
  $("meW").textContent = S.me.w.name; $("botW").textContent = S.bot.w.name; if (BOT_NAME) document.querySelector(".fighter.bot .name").textContent = BOT_NAME;
  $("hand2").hidden = !S.me.w.pair; $("h1").textContent = S.me.w.pair ? "Левая рука" : "Куда стрелять";
  logT(`${PLACES[sel.p].name}, старт ${S.dist} м`);
  resetChoice();
  if (window.Scene3D && !window.__scene3dReady){ try { window.__scene3dReady = Scene3D.init($("view3d")); } catch(e){ window.__scene3dErr = e.message+" @ "+(e.stack||"").split("\n")[1]; $("view3d").hidden = true; } }
  render();
}
$("start").onclick = start;
if (BOT_ID) start();
$("again").onclick = () => { $("setup").hidden=false; $("arena").hidden=true; $("turn").hidden=true; $("logCard").hidden=true; showScore(); };

function canShoot(f, d){ return d <= f.w.rng && d >= f.w.min; }
function resetChoice(){ choice = {hands:{}, move:"C", approach:false, smoke:false}; }
function myShots(){ if (S.me.w.pair) return [choice.hands[1],choice.hands[2]].filter(Boolean); return choice.hands[1]?[choice.hands[1]]:[]; }

function render(){
  $("dist").textContent = S.dist;
  for (const [k,f] of [["me",S.me],["bot",S.bot]]){
    $(k+"Hp").style.width = Math.max(0,f.hp)+"%";
    $(k+"Hp").style.background = f.hp>50? "var(--good)" : f.hp>25? "var(--warn)" : "var(--accent)";
    $(k+"HpN").textContent = Math.max(0,f.hp)+" / "+HP;
    const t = [];
    t.push(`<span class="tag ${canShoot(f,S.dist)?"ok":"no"}">${canShoot(f,S.dist)?"достаёт":(S.dist>f.w.rng?"не достаёт":"слишком близко")}</span>`);
    if (f.smokeTurns>0) t.push(`<span class="tag smoke">в дыму ${f.smokeTurns}</span>`);
    if (f.smokeLeft) t.push(`<span class="tag">дым ×1</span>`);
    $(k+"Tags").innerHTML = t.join("");
  }
  $("turnTitle").textContent = "Ход "+S.turn;
  const me = S.me, shootable = canShoot(me, S.dist) && !choice.smoke;
  document.querySelectorAll(".shoot").forEach(b=>{ b.disabled = !shootable; b.setAttribute("aria-pressed", String(choice.hands[b.dataset.hand]===b.dataset.d)); });
  $("shootHint").textContent = choice.smoke ? "Этот ход — дымовая граната, выстрела нет." : !canShoot(me,S.dist) ? (S.dist>me.w.rng ? `Противник дальше ${me.w.rng} м — нужно подойти.` : `Ближе ${me.w.min} м ваше оружие не стреляет.`) : me.w.pair ? "Каждая рука стреляет в свою позицию. Обе в одну — урон ×2,5." : "Угадали, куда сдвинется бот — попали.";
  document.querySelectorAll(".move").forEach(b=>b.setAttribute("aria-pressed", String(choice.move===b.dataset.m)));
  $("approach").classList.toggle("on", choice.approach); $("approach").disabled = S.dist<=0;
  $("smoke").classList.toggle("on", choice.smoke); $("smoke").disabled = !me.smokeLeft;
  $("turn").hidden = S.over;
  drawScheme();
  if (window.Scene3D) Scene3D.update({dist:S.dist, maxD:PLACES[sel.p].d, place:sel.p, me:{w:sel.w, lane:S.lastMe||"C", smoke:S.me.smokeTurns, hp:S.me.hp}, bot:{w:sel.b, lane:S.lastBot||"C", smoke:S.bot.smokeTurns, hp:S.bot.hp}});
}
function drawScheme(){
  const W=520, H=150, L=24, R=W-24, top=40, bot=120;
  const maxD = Math.max(PLACES[sel.p].d, 100), px = m => L + (R-L)*m/maxD;
  const me=S.me, bo=S.bot, d=S.dist;
  const laneY = {L:top+14, C:(top+bot)/2, R:bot-14};
  const myY = laneY[S.lastMe||"C"], botY = laneY[S.lastBot||"C"];
  const meRange = `<rect class="rme" x="${px(0)}" y="${top}" width="${px(Math.min(me.w.rng,maxD))-px(0)}" height="${bot-top}" rx="4"/>` +
    (me.w.min ? `<rect class="dead" x="${px(0)}" y="${top}" width="${px(me.w.min)-px(0)}" height="${bot-top}"/><text class="lbl" x="${px(me.w.min)-2}" y="${top-6}" text-anchor="end">мёртвая зона ${me.w.min} м</text>` : "");
  const botRange = `<rect class="rbot" x="${px(Math.max(0,d-bo.w.rng))}" y="${top}" width="${px(d)-px(Math.max(0,d-bo.w.rng))}" height="${bot-top}" rx="4"/>`;
  const meHits = canShoot(me,d), botHits = canShoot(bo,d);
  const stepsBot = d>bo.w.rng ? Math.ceil((d-bo.w.rng)/STEP) : 0, stepsMe = d>me.w.rng ? Math.ceil((d-me.w.rng)/STEP) : 0;
  const ticks = [0,100,200,300,400,500].filter(t=>t<=maxD).map(t=>`<line class="axis" x1="${px(t)}" y1="${bot}" x2="${px(t)}" y2="${bot+5}"/><text class="lbl" x="${px(t)}" y="${bot+17}" text-anchor="middle">${t}</text>`).join("");
  const smokeMe = me.smokeTurns>0 ? `<circle class="sm" cx="${px(0)}" cy="${myY}" r="22"/>` : "";
  const smokeBot = bo.smokeTurns>0 ? `<circle class="sm" cx="${px(d)}" cy="${botY}" r="22"/>` : "";
  const lanes = ["L","C","R"].map(k=>`<line class="lane" x1="${L}" y1="${laneY[k]}" x2="${R}" y2="${laneY[k]}"/>`).join("");
  const laneLbl = `<text class="lbl" x="${R+2}" y="${laneY.L+4}" text-anchor="start">л</text><text class="lbl" x="${R+2}" y="${laneY.C+4}" text-anchor="start">ц</text><text class="lbl" x="${R+2}" y="${laneY.R+4}" text-anchor="start">п</text>`;
  const info = `<text class="steps" x="${(px(0)+px(d))/2}" y="${top-8}" text-anchor="middle">${d} м · ${botHits?"бот достаёт":"боту идти "+stepsBot+" х."} · ${meHits?"вы достаёте":"вам идти "+stepsMe+" х."}</text>`;
  $("scheme").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема боя: дистанция ${d} м">
    ${meRange}${botRange}${lanes}<line class="axis" x1="${L}" y1="${bot}" x2="${R}" y2="${bot}"/>${ticks}${laneLbl}
    ${smokeMe}${smokeBot}
    <circle class="pme" cx="${px(0)}" cy="${myY}" r="8"/><text class="nm pme" x="${px(0)}" y="${bot+32}" text-anchor="middle">Вы</text>
    <circle class="pbot" cx="${px(d)}" cy="${botY}" r="8"/><text class="nm pbot" x="${px(d)}" y="${bot+32}" text-anchor="middle">Бот</text>
    ${info}</svg>
  <p class="hint">Светлая полоса слева — куда достаёте вы, справа — куда достаёт бот. Дорожки: лево / центр / право, кружок стоит там, куда боец сдвинулся на прошлом ходу.</p>`;
}
document.querySelectorAll(".shoot").forEach(b=>b.onclick=()=>{
  const h=b.dataset.hand, d=b.dataset.d;
  choice.hands[h] = (choice.hands[h]===d) ? undefined : d;
  render();
});
document.querySelectorAll(".move").forEach(b=>b.onclick=()=>{ choice.move=b.dataset.m; render(); });
$("approach").onclick=()=>{ choice.approach=!choice.approach; render(); };
$("smoke").onclick=()=>{ choice.smoke=!choice.smoke; if (choice.smoke) choice.hands={}; render(); };

// --- bot brain: simple but not stupid
function botPlan(){
  const b=S.bot, m=S.me, plan={shoot:[], move:["L","C","R"][Math.floor(Math.random()*3)], approach:false, smoke:false};
  if (!canShoot(b,S.dist)){
    if (S.dist>b.w.rng){
      plan.approach = true;
      if (b.smokeLeft && b.smokeTurns===0 && canShoot(m,S.dist)) plan.smoke = true; // under fire while walking → smoke
    }
    return plan;
  }
  const rnd=()=>["L","C","R"][Math.floor(Math.random()*3)];
  plan.shoot = b.w.pair ? [rnd(), rnd()] : [rnd()];
  if (S.dist > m.w.rng && b.w.rng >= S.dist) plan.approach=false; // bot has the range edge: hold it
  else if (S.dist > b.w.rng) plan.approach=true;
  return plan;
}

// --- damage of one shooter against target, returns {dmg, text}
function fire(shooter, target, plan, targetMove){
  const w=shooter.w, vis = target.smokeTurns>0 ? 0 : 1;
  let dmg=0, crits=0, hitBullets=0, guessed=false;
  const bullet = () => { const c = Math.random()<CRIT; if (c) crits++; hitBullets++; return w.dmg*(c?CRIT_MULT:1); };
  if (w.pair){
    const hitAny = plan.shoot.includes(targetMove);
    if (hitAny && Math.random()<vis){
      guessed=true;
      const focus = plan.shoot.length===2 && plan.shoot[0]===plan.shoot[1];
      dmg = Math.round(bullet()*(focus?w.focusMult:1));
    }
    return {dmg, guessed, crits, hitBullets};
  }
  guessed = plan.shoot[0]===targetMove;
  if (guessed){ if (Math.random()<vis) for(let i=0;i<w.bullets;i++) dmg+=bullet(); else guessed="blind"; }
  else for(let i=0;i<w.bullets;i++) if (Math.random()<w.stray*vis) dmg+=bullet();
  return {dmg:Math.round(dmg), guessed, crits, hitBullets};
}
function lineText(who, r, plan, moveKey, approach, tgt){
  const parts = [];
  if (plan.smoke) parts.push(`бросает дым (${tgt} не виден 2 хода)`);
  else if (plan.shoot.length){
    const focus = plan.shoot.length===2 && plan.shoot[0]===plan.shoot[1];
    const where = focus ? DIRS[plan.shoot[0]]+" с двух рук" : plan.shoot.map(d=>DIRS[d]).join(" и ");
    let s = `стреляет ${where} — `;
    if (r.guessed==="blind") s += "угадал, но цель в дыму, промах";
    else if (r.guessed) s += `угадал, −${r.dmg}`;
    else s += r.dmg>0 ? `не угадал, задел ${r.hitBullets} пул., −${r.dmg}` : "промах";
    if (r.crits) s += ` <span class="crit">(крит ×${r.crits})</span>`;
    parts.push(s);
  }
  parts.push(MOVES[moveKey]);
  if (approach) parts.push("подошёл на 50 м");
  return `${who}: ${parts.join("; ")}`;
}
$("go").onclick = () => {
  if (S.over) return;
  const me=S.me, bot=S.bot;
  if (!choice.smoke && canShoot(me,S.dist)){
    const need = me.w.pair ? 2 : 1;
    if (myShots().length<need){ $("shootHint").textContent = need===2 ? "Выберите позицию для каждой руки." : "Выберите, куда стрелять."; return; }
  }
  const bp = botPlan();
  logT(`Ход ${S.turn} · дистанция ${S.dist} м`);
  // smoke applied first
  if (choice.smoke && me.smokeLeft){ me.smokeLeft=0; me.smokeTurns=SMOKE_TURNS; }
  if (bp.smoke && bot.smokeLeft){ bot.smokeLeft=0; bot.smokeTurns=SMOKE_TURNS; }
  // shots (simultaneous)
  const myPlan = {shoot: choice.smoke?[]:myShots(), smoke:choice.smoke};
  const rMe = (myPlan.shoot.length && canShoot(me,S.dist)) ? fire(me, bot, myPlan, bp.move) : {dmg:0,guessed:false,crits:0,hitBullets:0};
  const rBot = (bp.shoot.length && canShoot(bot,S.dist)) ? fire(bot, me, bp, choice.move) : {dmg:0,guessed:false,crits:0,hitBullets:0};
  log(`<span class="me">${lineText("Вы", rMe, myPlan, choice.move, choice.approach, "бот")}</span>`);
  log(`<span class="bot">${lineText("Бот", rBot, bp, bp.move, bp.approach, "вы")}</span>`);
  if (window.Scene3D){ for (const d of myPlan.shoot) Scene3D.fx({from:"me", lane:d, hit:rMe.dmg>0}); for (const d of bp.shoot) Scene3D.fx({from:"bot", lane:d, hit:rBot.dmg>0}); }
  bot.hp -= rMe.dmg; me.hp -= rBot.dmg;
  S.lastMe = choice.move; S.lastBot = bp.move;
  // distance
  let d = S.dist; if (choice.approach) d-=STEP; if (bp.approach) d-=STEP; S.dist = Math.max(0,d);
  // smoke tick
  if (me.smokeTurns>0) me.smokeTurns--; if (bot.smokeTurns>0) bot.smokeTurns--;
  S.turn++;
  if (me.hp<=0 || bot.hp<=0){
    S.over=true;
    const win = bot.hp<=0 && me.hp>0, draw = bot.hp<=0 && me.hp<=0;
    $("result").hidden=false; $("result").className = "result "+(win?"win":"lose");
    $("result").textContent = draw ? "Ничья — оба легли" : win ? "Победа" : "Поражение";
    if (!draw){ if (win) score.w++; else score.l++; try{ localStorage.setItem("mc_score", JSON.stringify(score)); if (BOT_ID){ const r=JSON.parse(localStorage.getItem("mc_results")||"{}"); r[BOT_ID]={win, t:Date.now()}; localStorage.setItem("mc_results", JSON.stringify(r)); } }catch(e){} }
    $("again").hidden=false;
  }
  resetChoice(); render();
  $("log").scrollTop = 0;
};
function log(html){ const p=document.createElement("div"); p.innerHTML=html; $("log").prepend(p); }
function logT(t){ const p=document.createElement("div"); p.className="t"; p.textContent=t; $("log").prepend(p); }
</script>
</body>
