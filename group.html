<style>

/* Layout: one column, phone-first. Setup card → arena (distance strip, two fighters) → turn controls → log. */
:root{
  --bg:#f1efe8; --panel:#ffffff; --fg:#1b1a17; --muted:#6b675c; --line:#d8d4c8;
  --accent:#b23a1e; --accent-fg:#ffffff; --enemy:#2d5f8a; --good:#2f7a3d; --warn:#b7861a;
  --smoke:#8a8a8a;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1f2226; --fg:#ecebe6; --muted:#9a9890; --line:#34393f;
  --accent:#e0593a; --accent-fg:#15171a; --enemy:#5e9bd1; --good:#5fb56f; --warn:#d9a83a; --smoke:#6a6f76; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1f2226; --fg:#ecebe6; --muted:#9a9890; --line:#34393f;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;font-size:15px;line-height:1.4}
h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase}
h2{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sub{color:var(--muted);font-size:12px;margin:2px 0 8px}

.row{display:flex;gap:8px;flex-wrap:wrap}

.opt small{display:block;color:var(--muted);font-size:12px;font-family:var(--mono)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg);width:100%}
.btn.secondary{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.field{display:block;margin-bottom:10px}
/* arena */
.fighters{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.fighter{min-width:0}
.fighter .name{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.fighter.me .name{color:var(--accent)} .fighter.bot .name{color:var(--enemy)}
.fighter .w{font-size:12px;color:var(--muted);font-family:var(--mono)}
.hp{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.hp i{display:block;height:100%;background:var(--good);transition:width .3s}
.hpn{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.dist{text-align:center;font-family:var(--display);font-size:24px;line-height:1;padding-top:4px;font-variant-numeric:tabular-nums}
.dist small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.smoke{border-color:var(--smoke);color:var(--smoke)}
.tag.ok{border-color:var(--good);color:var(--good)} .tag.no{border-color:var(--warn);color:var(--warn)}
.scene-heading{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:12px}
.view3d{margin-top:6px;border-radius:8px;overflow:hidden;background:var(--line)}
.view3d canvas{display:block}
/* turn controls */
.turnHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.turnHead h2{margin:0}
.turnGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{min-width:0}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0}
.irow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ib{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:7px;padding:5px 2px 3px;font:inherit;cursor:pointer;display:grid;justify-items:center;gap:1px;min-width:0}
.ib svg{width:34px;height:20px;display:block}
.ib small{font-size:10px;color:var(--muted);line-height:1}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ib[aria-pressed="true"] small{color:var(--accent-fg)}
.ib.move[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ib.move[aria-pressed="true"] small{color:var(--bg)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.log.last{max-height:none;margin-bottom:4px}
#logMore summary{cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
/* log */
.log{font-family:var(--mono);font-size:12px;line-height:1.45;max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log .t{color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.log .me{color:var(--accent)} .log .bot{color:var(--enemy)} .log .crit{color:var(--warn);font-weight:500}
.result{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;text-align:center;padding:8px 0}
.result.win{color:var(--good)} .result.lose{color:var(--accent)}
.score{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){ .hp i{transition:none} }

.ib{cursor:pointer}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;margin-top:8px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
/* Metres are authoritative. Lanes do not add distance to weapon reach. */
(function(root,factory){const api=factory();if(typeof module==='object')module.exports=api;else root.FieldRules=api;})(typeof window==='object'?window:globalThis,()=>{
  const classes=[
    {id:'sniper',name:'Снайпер',range:1000,count:3},
    {id:'auto',name:'Автомат',range:600,count:3},
    {id:'mg',name:'Пулемёт',range:400,count:2},
    {id:'grenade',name:'Гранатомёт',range:300,count:2,provisional:true},
    {id:'pistols',name:'Пистолеты',range:240,count:2},
    {id:'shotgun',name:'Дробовик',range:200,count:3}
  ];
  const alive=u=>u.hp>0;
  function initial(){const units=[];for(const team of ['me','bot'])for(const c of classes)for(let i=0;i<c.count;i++)units.push({id:team+'-'+c.id+'-'+i,team,weapon:c.id,name:(team==='me'?'Наш ':'Их ')+c.name+' '+(i+1),range:c.range,m:500+(team==='me'?-1:1)*c.range/2,lane:c.count===2?i*2:i,hp:100,smoke:0});return {depth:1000,width:300,step:50,turn:1,units};}
  function front(s,team){const group=s.units.filter(u=>u.team===team&&alive(u));return group.length?(team==='me'?Math.max(...group.map(u=>u.m)):Math.min(...group.map(u=>u.m))):null;}
  function center(s){const a=front(s,'me'),b=front(s,'bot');return a===null||b===null?s.depth/2:(a+b)/2;}
  function distance(a,b){return Math.abs(a.m-b.m);}

    if(mode==='side'&&state&&QUIET){const u=state.units.find(u=>u.id===playerId),t=state.units.find(u=>u.id===targetId);if(u&&t){focus=vec(0,.3,(z(u.m)+z(t.m))/2);span=Math.max(10,Math.abs(z(u.m)-z(t.m))*1.25+8);}}
    camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;
    camera.position.copy(focus).add(mode==='side'?vec(38,24,6):mode==='close'?vec(14,13,18):vec(3,38,19));camera.lookAt(focus);camera.updateProjectionMatrix();draw();
  }
  function make(u){
    const model=FieldModels.create(u.team,u.weapon);model.scale.setScalar(.64);scene.add(model);
    const ring=new THREE.Mesh(new THREE.RingGeometry(.35,.43,32),new THREE.MeshBasicMaterial({color:colors[u.team],side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;scene.add(ring);
    const hit=new THREE.Mesh(new THREE.BoxGeometry(.85,1.8,.85),new THREE.MeshBasicMaterial({visible:false}));hit.userData.id=u.id;scene.add(hit);
    const smoke=new THREE.Mesh(new THREE.SphereGeometry(.9,16,10),new THREE.MeshStandardMaterial({color:0xbdc7c4,transparent:true,opacity:0,depthWrite:false,roughness:1}));smoke.scale.set(1.6,.8,1.3);scene.add(smoke);
    const label=textLabel('',vec());return {model,ring,hit,smoke,label};
  }
  function update(s,me,target){state=s;playerId=me;targetId=target;const player=s.units.find(u=>u.id===me),enemy=s.units.find(u=>u.id===target);
    for(const [id,o] of units)if(!s.units.some(u=>u.id===id)){o.model.removeFromParent();for(const item of [o.ring,o.hit,o.smoke]){item.geometry.dispose();item.material.dispose();item.removeFromParent();}o.label.el.remove();units.delete(id);}
    for(const u of s.units){if(!units.has(u.id))units.set(u.id,make(u));const o=units.get(u.id),xx=x(u.lane),zz=z(u.m),threat=u.team!==player.team&&FieldRules.reach(u,player);
      o.model.position.set(xx,0,zz);o.model.visible=u.hp>0;o.ring.position.set(xx,.08,zz);o.ring.visible=u.hp>0;o.ring.material.color.set(u.id===target?0xffe2a0:u.id===me?0xffffff:threat?0xea754c:colors[u.team]);o.ring.scale.setScalar(u.id===target||u.id===me?1.35:1);
      o.hit.position.set(xx,.8,zz);o.hit.visible=u.hp>0;o.smoke.position.set(xx,.6,zz);o.smoke.visible=u.smoke>.001;o.smoke.material.opacity=Math.min(.7,u.smoke*.7);
      o.label.position.set(xx,1.65,zz);o.label.el.textContent=QUIET?(u.id===me?'Вы':u.id===target?u.name:''):(u.id===me?'Вы':u.id===target?'Цель · '+u.name:threat?'Угроза · '+u.name:'')+(u.hp<100?' · '+u.hp+' HP':'');o.label.el.className='map-label unit-label '+(u.id===target?'selected':'');o.label.el.hidden=!o.label.el.textContent||u.hp<=0;
    }
    const c=FieldRules.center(s);centerLine.position.z=z(c);overlay.position.z=z(c);overlay.el.textContent='ЦЕНТР · '+Math.round(c)+' м';
    const low=Math.max(0,player.m-player.range),high=Math.min(s.depth,player.m+player.range);range.scale.y=(high-low)/S;range.position.z=z((low+high)/2);
    if(enemy){const length=FieldRules.distance(player,enemy)/S;arrow.position.set(5.7,.18,z(player.m));arrow.setDirection(vec(0,0,enemy.m>=player.m?-1:1));arrow.setLength(Math.max(.001,length),Math.min(.55,length*.3),.3);arrow.visible=length>0;measure.position.set(5.7,.3,z((player.m+enemy.m)/2));const travel=FieldRules.travel(player,enemy);measure.el.textContent=travel.metres+' м · до выстрела '+travel.toFire+' ход.';}
    blastMesh.visible=false;compose();
  }
  function project(p){const q=p.clone().project(camera);return {x:(q.x+1)*container.clientWidth/2,y:(1-q.y)*container.clientHeight/2,visible:q.z>-1&&q.z<1&&Math.abs(q.x)<.98&&Math.abs(q.y)<.98};}
  function draw(){if(!renderer)return;renderer.render(scene,camera);const placed=[];const items=[...anchors,...[...units.values()].map(o=>o.label)];items.sort((a,b)=>project(a.position).y-project(b.position).y);for(const a of items){const p=project(a.position);a.el.style.visibility=p.visible?'visible':'hidden';if(!p.visible||a.el.hidden)continue;const width=a.el.offsetWidth,height=a.el.offsetHeight;let left=Math.max(width/2+3,Math.min(container.clientWidth-width/2-3,p.x)),top=p.y;for(let attempt=0;attempt<8;attempt++){const conflict=placed.some(r=>Math.abs(left-r.x)<(width+r.w)/2+2&&Math.abs(top-r.y)<Math.max(height,r.h)+2);if(!conflict)break;top+=height+2;}a.el.style.left=left+'px';a.el.style.top=top+'px';placed.push({x:left,y:top,w:width,h:height});}}
  function view(value){mode=value;compose();}
  function blast(id,radius){const u=state.units.find(u=>u.id===id);if(!u||!Number.isFinite(radius)||radius<=0)return;blastMesh.position.set(x(u.lane),.12,z(u.m));blastMesh.scale.setScalar(radius/S);blastMesh.visible=true;draw();}
  function dispose(){observer?.disconnect();cancelAnimationFrame(frame);scene?.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){for(const m of [].concat(o.material))m.dispose();}});FieldModels.dispose();renderer?.dispose();container?.replaceChildren();units.clear();anchors.length=0;renderer=null;}
  return {init,update,view,blast,dispose,project,stats:()=>({units:units.size,calls:renderer.info.render.calls,geometries:renderer.info.memory.geometries})};
})();

</script>
<script>
const $=id=>document.getElementById(id), R=FieldRules;
const NAMES={'bot-sniper':['Старый Фома','Тихий Глеб','Док'],'bot-auto':['Лёха Вахта','Боря Проезд','Гоша Пятак'],'bot-mg':['Макс Гильза','Кочерга'],'bot-grenade':['Базука','Труба'],'bot-pistols':['Витя Толстый','Сеня Шило'],'bot-shotgun':['Кира Дым','Лысый','Шрам']};
const GEAR={sniper:'масхалат · тепловизор',auto:'лёгкий бронежилет',mg:'тяжёлый бронежилет',grenade:'без брони',pistols:'без брони',shotgun:'лёгкий бронежилет'};
const CLS=Object.fromEntries(R.classes.map(c=>[c.id,c.name]));
const ICO={'sniper':'<rect x="3" y="6" width="34" height="2"/><rect x="10" y="3" width="8" height="3"/><rect x="24" y="8" width="2" height="5"/>','auto':'<rect x="4" y="5" width="30" height="3"/><rect x="14" y="8" width="4" height="5"/><rect x="6" y="3" width="6" height="5"/>','mg':'<rect x="4" y="5" width="30" height="4"/><rect x="12" y="9" width="8" height="4"/><rect x="26" y="9" width="2" height="4"/><rect x="31" y="9" width="2" height="4"/>','shotgun':'<rect x="4" y="5" width="14" height="4"/><rect x="18" y="4" width="16" height="3"/><rect x="18" y="8" width="16" height="3"/>','pistols':'<rect x="10" y="5" width="8" height="3"/><rect x="10" y="8" width="3" height="4"/><rect x="22" y="5" width="8" height="3"/><rect x="22" y="8" width="3" height="4"/>','grenade':'<rect x="4" y="5" width="26" height="4"/><circle cx="33" cy="7" r="4"/>'};
const VIS={sniper:.7,auto:1,mg:1,grenade:1,pistols:1,shotgun:1}; // масхалат у снайперов ×0,7
function visibility(u){ return Math.round(100*VIS[u.weapon]*(1-u.smoke*0.4)); }
let state=R.initial(), player='me-auto-1', target='bot-shotgun-1', lane=1;
for(const u of state.units){ const k=u.team+'-'+u.weapon; if(NAMES[k]) u.name=NAMES[k][Number(u.id.split('-')[2])]||u.name; u.lvl=u.team==='bot'?[12,9,21,7,15,3,8,2,6,11,4,17,5,13,10][state.units.indexOf(u)%15]:50; }
const get=id=>state.units.find(u=>u.id===id);
function select(id){ const u=get(id); if(!u||u.hp<=0)return; if(u.team==='me'){player=id;lane=u.lane;} else target=id; render(); }
function render(){
  const p=get(player), t=get(target);
  Field3D.update(state,player,target);
  $("meName").textContent='Вы · '+CLS[p.weapon];
  const threats=state.units.filter(u=>u.team==='bot'&&R.reach(u,p));
  $("aim").innerHTML='в вас целятся: '+threats.slice(0,3).map(()=>'<i></i>').join('')+' <span>· '+threats.length+' достают · дальность '+p.range+' м · позиция '+p.m+' м</span>';
  $("tName").textContent=t.name; $("tName2").textContent=t.name;
  const d=R.travel(p,t);
  $("tGear").textContent=CLS[t.weapon]+' · ур. '+t.lvl+' · '+GEAR[t.weapon]+' · '+d.metres+' м · '+(d.toFire?'идти '+d.toFire+' х.':'в вашей дальности');
  document.querySelectorAll('.move').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.lane)===lane));
  $("turnLbl").textContent='ход '+state.turn+' · 0:42';
  renderStrip(p);
}
function renderStrip(p){
  const list=state.units.filter(u=>u.team==='bot').sort((a,b)=>(b.hp>0)-(a.hp>0)||R.reach(b,p)-R.reach(a,p)||R.distance(p,a)-R.distance(p,b));
  $("strip").innerHTML=list.map(u=>{ const dead=u.hp<=0, d=R.travel(p,u), col=u.hp>50?'var(--good)':u.hp>25?'var(--warn)':'var(--accent)', vis=visibility(u);
    return `<button class="ec ${R.reach(u,p)?'threat':''} ${u.id===target?'sel':''} ${dead?'dead':''}" data-id="${u.id}">
      <div class="h"><svg viewBox="0 0 40 14">${ICO[u.weapon]}</svg><span class="n">${u.name}</span></div>
      <div class="hp"><i style="width:${u.hp}%;background:${col}"></i></div>
      <div class="r"><span>${CLS[u.weapon]} · ур. ${u.lvl}</span><b>${u.hp} хп</b></div>
      <div class="r"><span>${dead?'выбыл':d.metres+' м · '+(d.toFire?d.toFire+' х.':'достаю')}</span><b>видим ${vis}%</b></div></button>`; }).join('');
  $("strip").querySelectorAll('.ec').forEach(b=>b.onclick=()=>select(b.dataset.id));
  const alive=list.filter(u=>u.hp>0).length, thr=list.filter(u=>R.reach(u,p)).length;
  $("cnt").textContent=`живых ${alive} · достают ${thr}`;
}
try{ if(!window.THREE) throw Error('3D не загрузилось'); Field3D.init($("field"),{onSelect:select}); $("loading").remove(); Field3D.view('side'); render(); }catch(e){ $("loading").textContent=e.message; }
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));Field3D.view(b.dataset.view);});
document.querySelectorAll('.move').forEach(b=>b.onclick=()=>{lane=Number(b.dataset.lane);render();});
document.querySelectorAll('.shoot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.shoot').forEach(x=>x.setAttribute('aria-pressed',x===b));});
$("go").onclick=()=>{ const p=get(player),t=get(target); R.nextTurn(state); p.lane=lane; let moved=0; if($("approach").checked) moved=R.advance(state,p); if($("smoke").checked) p.smoke=1; const dir=document.querySelector('.shoot[aria-pressed="true"]').querySelector('small').textContent;
  $("last").innerHTML='<div class="t">Ход '+(state.turn-1)+'</div><div class="me1">Вы: стреляет '+dir+' в '+t.name+' — (урон считает сервер); '+['сдвинулся влево','остался на месте','сдвинулся вправо'][lane]+(moved?'; подошёл на '+moved+' м':'')+($("smoke").checked?'; поставил дым':'')+'</div><div class="en">'+t.name+': стреляет в вас — промах; остался на месте</div><div class="t" style="margin-top:4px">центр '+R.center(state)+' м</div>';
  $("approach").checked=$("smoke").checked=false; render(); };
$("full").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $("field").requestFullscreen();}catch{}};
</script>
